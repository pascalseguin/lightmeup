name: Release

# Push a tag like v0.1.0 to build the installers and publish a GitHub release.
# "Run workflow" builds the same packages as downloadable artifacts without releasing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: |
          pip install pyinstaller==6.22.3
          choco install innosetup -y --no-progress
      - name: Build installer and portable zip
        run: python packaging/build.py windows
      - name: Smoke test
        run: build\pyinstaller\dist\LightMeUp\LightMeUp.exe --version
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  linux:
    # Oldest supported runner, so the AppImage works on older distributions too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: pip install pyinstaller==6.22.3
      - name: Build .deb and AppImage
        run: python packaging/build.py linux
      - name: Smoke test
        run: |
          chmod +x dist/*.AppImage
          LIGHTMEUP_NO_TERMINAL=1 APPIMAGE_EXTRACT_AND_RUN=1 ./dist/*.AppImage --version
          sudo apt-get install -y ./dist/*.deb
          lightmeup --version
          test -f /usr/share/applications/lightmeup.desktop
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Check the tag matches the version in server.py
        run: |
          v=$(python3 -c "import re;print(re.search(r'__version__ = \"(.+)\"', open('server.py').read()).group(1))")
          test "v$v" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match version $v"; exit 1; }
      - name: Release notes
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## \\[?"v"\\]?" {on=1; next} /^## / && on {exit} on' CHANGELOG.md > notes.md
          cat packaging/release-notes-footer.md >> notes.md
          (cd dist && sha256sum * > SHA256SUMS.txt)
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "LightMeUp ${GITHUB_REF_NAME#v}" --notes-file notes.md
